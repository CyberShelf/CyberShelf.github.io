<section class="py-12 border-t border-slate-800 px-4 section-tone-c backdrop-blur-md">
  <div class="container mx-auto max-w-3xl">
    <h2>تماس با ما</h2>
    <p class="section-description">برای پرسش درباره مسیر یادگیری، منابع یا سفارش کتاب پیام بفرستید.</p>

    <form action="https://formspree.io/f/mandvbdl" method="POST" class="contact-form space-y-4">

      <label for="contactName">نام و نام خانوادگی</label>
      <input
        id="contactName"
        type="text"
        name="name"
        placeholder="نام و نام‌خانوادگی"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      >

      <label for="contactEmail">ایمیل</label>
      <input
        id="contactEmail"
        type="email"
        name="_replyto"
        placeholder="ایمیل"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      >

      <label for="contactBook">کتاب موردنظر <span>(اختیاری)</span></label>
      <select id="contactBook" name="book" class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <option value="">انتخاب کنید</option>
        <option>مقدمه‌ای بر Windows API برای تیم قرمز</option>
        <option>مدیریت عملیات تیم قرمز</option>
        <option>مقدمه‌ای بر تحلیل بدافزار</option>
        <option>تکنیک‌های عملی فرار از AV/EDR</option>
        <option>مقدمه‌ای بر Bug Bounty</option>
        <option>مقدمه‌ای بر توسعه تهاجمی</option>
      </select>

      <label for="contactMessage">پیام</label>
      <textarea
        id="contactMessage"
        name="message"
        rows="5"
        placeholder="پیام"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      ></textarea>

      <button
        type="submit"
        class="w-full px-5 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 text-black font-bold shadow-lg shadow-cyan-500/50 hover:scale-105 transition-transform duration-300"
      >
        ارسال درخواست
      </button>
    </form>
  </div>
</section>
