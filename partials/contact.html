<section class="py-12 border-t border-slate-800 px-4 section-tone-c backdrop-blur-md">
  <div class="container mx-auto max-w-3xl">
    <h2 class="text-3xl font-extrabold mb-8 text-emerald-400 drop-shadow-lg">📬 تماس با ما</h2>

    <form action="https://formspree.io/f/mandvbdl" method="POST" class="contact-form space-y-4">
      
      <input
        type="text"
        name="name"
        placeholder="نام و نام‌خانوادگی"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      >

      <input
        type="email"
        name="_replyto"
        placeholder="ایمیل"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      >

      <textarea
        name="message"
        rows="5"
        placeholder="پیام"
        class="appearance-none w-full border border-slate-700 rounded-2xl p-3 bg-slate-900 text-emerald-300 placeholder:text-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all duration-300"
        required
      ></textarea>

      <button
        type="submit"
        class="w-full px-5 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 text-black font-bold shadow-lg shadow-cyan-500/50 hover:scale-105 transition-transform duration-300"
      >
        ارسال
      </button>
    </form>
  </div>
</section>
