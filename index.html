<!doctype html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سایبر شلف — مرجع کتاب‌های تخصصی برنامه‌نویسی</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- استایل اختصاصی -->
  <link href="assets/css/style.css" rel="stylesheet">

  <!-- اسکریپت -->
  <script src="assets/js/app.js" defer></script>
</head>
<body class="dark:bg-slate-950">

  <!-- ===== هدر مستقیم ===== -->
  <header class="sticky top-0 z-50">
    <div class="bg-black/70 backdrop-blur-md border-b border-slate-800/60">
      <div class="max-w-7xl mx-auto flex items-center justify-between py-3 px-4 md:px-6">
        <!-- برند -->
        <a href="#home" class="flex items-center gap-2 font-bold text-lg text-emerald-400 hover:text-emerald-300 transition">
          <svg width="18" height="18" viewBox="0 0 24 24" class="opacity-90" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 6L4 12L10 18" />
            <path d="M14 6L20 12L14 18" />
          </svg>
          سایبر شلف
        </a>

        <!-- ناوبری دسکتاپ -->
        <nav class="hidden md:flex items-center gap-6 text-sm">
          <a href="#home" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">خانه</a>
          <a href="#shop" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">فروشگاه</a>
          <a href="#telegram" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">تلگرام</a>
          <a href="#books-en" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">دانلود منابع تخصصی (انگلیسی)</a>
          <a href="#tools" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">ابزارها</a>
          <a href="#faq" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">سوالات متداول</a>
          <a href="#about" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">درباره ما</a>
          <a href="#contact" class="relative text-slate-300 hover:text-emerald-400 transition after:absolute after:-bottom-1 after:right-0 after:h-px after:w-0 hover:after:w-full after:bg-emerald-400 after:transition-all">تماس با ما</a>          
        </nav>

        <!-- دکمه منوی موبایل -->
        <button id="menuBtn" class="md:hidden p-2 rounded-xl ring-1 ring-slate-700 hover:bg-slate-800 transition" aria-label="باز کردن منو" aria-expanded="false" aria-controls="mobileMenu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="pointer-events-none">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- منوی موبایل -->
    <div id="mobileMenu" class="md:hidden hidden fixed top-16 right-0 left-0 z-50 bg-black/80 backdrop-blur-md border-t border-slate-800">

      <nav class="px-4 py-3 flex flex-col gap-3 text-sm">
        <a href="#home" class="py-2 text-slate-200 hover:text-emerald-400 transition">خانه</a>
        <a href="#shop" class="py-2 text-slate-200 hover:text-emerald-400 transition">فروشگاه</a>
        <a href="#telegram" class="py-2 text-slate-200 hover:text-emerald-400 transition">تلگرام</a>
        <a href="#books-en" class="py-2 text-slate-200 hover:text-emerald-400 transition">دانلود منابع تخصصی (انگلیسی)</a>
        <a href="#tools" class="py-2 text-slate-200 hover:text-emerald-400 transition">ابزارها</a>
        <a href="#faq" class="py-2 text-slate-200 hover:text-emerald-400 transition">سوالات متداول</a>
        <a href="#about" class="py-2 text-slate-200 hover:text-emerald-400 transition">درباره ما</a>
        <a href="#contact" class="py-2 text-slate-200 hover:text-emerald-400 transition">تماس با ما</a>
      </nav>
    </div>
  </header>

  <!-- ===== بخش‌های اصلی ===== -->
  <section id="home"></section>
  <section id="shop"></section>
  <section id="telegram"></section>
  <section id="books"></section>
  <section id="books-en"></section>
  <section id="tools"></section>
  <section id="faq"></section>
  <section id="about"></section>
  <section id="contact"></section>
  <footer id="footer"></footer>

  <!-- دکمه بازگشت به بالا -->
  <button id="backToTop" class="fixed bottom-6 right-6 w-12 h-12 flex items-center justify-center rounded-full bg-gradient-to-tr from-emerald-400 via-teal-400 to-cyan-400 shadow-lg shadow-cyan-500/50 text-black text-xl opacity-0 pointer-events-none z-50 hover:scale-110 transition-transform duration-300">
    ⬆
  </button>
</body>
</html>
